# CONFIGMAP
# almacena configuraciones no sensibles en pares clave-valor,
# solo que a diferencia de un secret este está en texto plano.
# se usa en variables de entorno, command line, etc

apiVersion: v1
kind: ConfigMap
metadata:
  name: luissanchez-config
  namespace: luissanchez
  labels:
    app: luissanchez-nginx
data:
  APP_ENV: "produccion"
  APP_PORT: "80"
  APP_VERSION: "1.0.0"